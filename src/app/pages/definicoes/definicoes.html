<app-cabecalho-app />

<main class="pagina">
  <header class="cabecalho">
    <p class="etiqueta">O teu aventureiro</p>
    <h1>Definições</h1>
  </header>

  <section aria-labelledby="titulo-aspeto">
    <h2 id="titulo-aspeto" class="titulo-seccao">Aspeto</h2>
    <div class="cartao">
      <fieldset class="definicao">
        <legend>Tema</legend>
        <div class="chips">
          <label class="chip">
            <input type="radio" name="tema" value="automatico" [(ngModel)]="tema" (ngModelChange)="mudarTema($event)">
            <span>◐ Automático</span>
          </label>
          <label class="chip">
            <input type="radio" name="tema" value="claro" [(ngModel)]="tema" (ngModelChange)="mudarTema($event)">
            <span>☀ Claro</span>
          </label>
          <label class="chip">
            <input type="radio" name="tema" value="escuro" [(ngModel)]="tema" (ngModelChange)="mudarTema($event)">
            <span>☾ Escuro</span>
          </label>
        </div>
        <p class="nota">O modo automático segue as definições do teu dispositivo.</p>
      </fieldset>
    </div>
  </section>

  @if (utilizador) {
  <section aria-labelledby="titulo-perigo" class="perigo">
    <h2 id="titulo-perigo" class="titulo-seccao">Zona de perigo</h2>
    <div class="cartao">
      <p>Apagar este perfil remove para sempre a jornada, os treinos e todo o progresso de {{ utilizador.nome }}.</p>
      <button type="button" class="botao-perigo" (click)="apagarPerfil()">✖ Apagar perfil</button>
    </div>
  </section>
  }
</main>
