<main class="pagina">
  <h1>Novo aventureiro</h1>
  <p class="subtitulo">Toda a jornada começa com um primeiro passo.</p>

  @if (erro()) {
  <p class="erro-geral" role="alert">⚠ {{ erro() }}</p>
  }

  <app-formulario-perfil
    [textoBotao]="aGuardar() ? 'A preparar a jornada...' : 'Começar a jornada'"
    (submetido)="criar($event)"
    (cancelado)="voltar()" />
</main>
